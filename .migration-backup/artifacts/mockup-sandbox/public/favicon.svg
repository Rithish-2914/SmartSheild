<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      .shield-outline { fill: none; stroke: #2563eb; stroke-width: 3; stroke-linejoin: round; }
      .shield-fill { fill: #3b82f6; opacity: 0.1; }
      .checkmark { fill: #2563eb; }
    </style>
  </defs>
  
  <!-- Shield background -->
  <path class="shield-fill" d="M 50 10 L 85 25 L 85 50 Q 85 75 50 85 Q 15 75 15 50 L 15 25 Z"/>
  
  <!-- Shield outline -->
  <path class="shield-outline" d="M 50 10 L 85 25 L 85 50 Q 85 75 50 85 Q 15 75 15 50 L 15 25 Z"/>
  
  <!-- Checkmark -->
  <g class="checkmark">
    <path d="M 38 52 L 46 60 L 62 40" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>