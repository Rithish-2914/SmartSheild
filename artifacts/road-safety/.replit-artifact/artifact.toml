kind = "web"
previewPath = "/"
title = "Road Safety Dashboard"
version = "1.0.0"
id = "artifacts/road-safety"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24668

[services.development]
run = "pnpm --filter @workspace/road-safety run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/road-safety", "run", "build" ]
publicDir = "artifacts/road-safety/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24668"
BASE_PATH = "/"
